<html>
  <body>
    <h1>Horizontal centering (margin: auto)</h1>

    <p><b>Fixed-width block centered in the page:</b></p>
    <div style="width: 300px; margin: auto; background-color: #8ec5ff">width: 300px, margin: auto</div>

    <p><b>Centered block nested inside a wider centered block:</b></p>
    <div style="width: 400px; margin: auto; background-color: #dee2e6">
      <div style="width: 160px; margin: auto; background-color: #ffc078">inner 160px</div>
    </div>

    <p><b>Without margin: auto, the same block stays left-aligned:</b></p>
    <div style="width: 300px; background-color: #b2f2bb">width: 300px, no margin</div>
  </body>
</html>
